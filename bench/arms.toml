# Benchmark arms. Paths are build directories from scripts/build-arm.sh.
[main]
binary = "~/git_repositories/highs-builds/main/bin/highs"

[dev]
binary = "~/git_repositories/highs-builds/dev/bin/highs"

[dev-tideseed]
binary = "~/git_repositories/highs-builds/dev-tideseed/bin/highs"

[lab-cpm]
binary = "~/git_repositories/highs-builds/lab-cpm/bin/highs"

[lab-fw]
binary = "~/git_repositories/highs-builds/lab-fw/bin/highs"

[lab-ht]
binary = "~/git_repositories/highs-builds/lab-ht/bin/highs"

[lab-sym]
binary = "~/git_repositories/highs-builds/lab-sym/bin/highs"

[lab-dse]
binary = "~/git_repositories/highs-builds/lab-dse/bin/highs"

[dev-tideseed-nodse]
binary = "~/git_repositories/highs-builds/dev-tideseed-nodse/bin/highs"

[stable]
# latest release v1.15.1
binary = "~/git_repositories/highs-builds/stable/bin/highs"

[dts-native]
binary = "~/git_repositories/highs-builds/dts-native/bin/highs"

[dts-pgo]
binary = "~/git_repositories/highs-builds/dts-pgo/bin/highs"

[dts-v2]
# dev-tideseed v2: + presolve-changed-col, pairwise cost 64
binary = "~/git_repositories/highs-builds/dts-v2/bin/highs"

[dts-v2-nodse]
binary = "~/git_repositories/highs-builds/dts-v2-nodse/bin/highs"

# ---- option-sweep arms (night 2 candidates), all on dev-tideseed v2
[v2-zi]
binary = "~/git_repositories/highs-builds/dts-v2/bin/highs"
options = { mip_heuristic_run_zi_round = true }

[v2-shift]
binary = "~/git_repositories/highs-builds/dts-v2/bin/highs"
options = { mip_heuristic_run_shifting = true }

[v2-heur10]
binary = "~/git_repositories/highs-builds/dts-v2/bin/highs"
options = { mip_heuristic_effort = 0.1 }

[v2-heur20]
binary = "~/git_repositories/highs-builds/dts-v2/bin/highs"
options = { mip_heuristic_effort = 0.2 }

[lab-dsm]
# lab/dual-substitution-mirrored (X1)
binary = "~/git_repositories/highs-builds/lab-dsm/bin/highs"

[lab-dsm2]
# X1 restricted to lock rows with >= 3 entries
binary = "~/git_repositories/highs-builds/lab-dsm2/bin/highs"

[dse-cache]
# DSE: basis-hash cache only (diagnostic)
binary = "~/git_repositories/highs-builds/dse-cache/bin/highs"

[dse-carry]
# DSE: cut-row carry only (diagnostic)
binary = "~/git_repositories/highs-builds/dse-carry/bin/highs"

[dts-v3]
# dev-tideseed v3 4a7937f32e: clique marking + symmetry + free wins + P1 + dse-cache + X1
binary = "~/git_repositories/highs-builds/dts-v3/bin/highs"

[dts-v3-pgo]
# same source, PGO (-mcpu=native, non-MIPLIB training set)
binary = "~/git_repositories/highs-builds/dts-v3-pgo/bin/highs"
